<!doctype html>
<html lang="en" class="antialiased scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SmartCampus | AI-Powered Academic System</title>
    
    <!-- Primary Meta Tags -->
    <meta name="title" content="SmartCampus | AI-Powered Academic System" />
    <meta name="description" content="Transform timetable PDFs into a searchable academic dashboard. Built for academic operations teams." />
    <meta name="theme-color" content="#1f6f5f" />
    
    <!-- Premium Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>" />

    <!-- Performance & Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />

    <!-- Preloader Styles -->
    <style>
      #initial-loader {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: radial-gradient(circle at top left, rgba(192, 108, 78, 0.08), transparent 40%),
                    radial-gradient(circle at bottom right, rgba(31, 111, 95, 0.08), transparent 40%),
                    #f4efe7;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        z-index: 99999; font-family: 'Outfit', sans-serif;
        transition: opacity 0.6s cubic-bezier(0.8, 0, 0.2, 1);
      }
      #initial-loader.hidden { opacity: 0; pointer-events: none; }
      
      .loader-ring {
        width: 60px; height: 60px;
        border: 4px solid rgba(31, 111, 95, 0.15);
        border-top-color: #1f6f5f; border-right-color: #1f6f5f;
        border-radius: 50%; animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        margin-bottom: 24px;
      }
      @keyframes spin { 100% { transform: rotate(360deg); } }
      
      .loader-text {
        color: #1f2933; font-size: 1.1rem; font-weight: 700;
        letter-spacing: 4px; text-transform: uppercase;
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 0.5; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1); } }
    </style>
  </head>
  <body>
    <!-- Premium Preloader -->
    <div id="initial-loader">
      <div class="loader-ring"></div>
      <div class="loader-text">SmartCampus</div>
    </div>

    <!-- React Root -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Preloader Removal Logic -->
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('initial-loader');
          if (loader) {
            loader.classList.add('hidden');
            setTimeout(() => loader.remove(), 600);
          }
        }, 800);
      });
    </script>
  </body>
</html>
